name: Cloud accessibility audit

on:
  workflow_dispatch:
    inputs:
      urls:
        description: "URLs to audit, one per line"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: a11y-audit-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_DIR: /tmp/a11y-audit
      AUDIT_URLS: ${{ inputs.urls }}

    steps:
      - name: Check out audit kit
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect URLs
        shell: bash
        run: |
          mkdir -p "$RUN_DIR/reports"
          printf '%s\n' "$AUDIT_URLS" | sed 's/[[:space:]]*$//' | grep -v '^$' > "$RUN_DIR/urls.txt"

          if [[ ! -s "$RUN_DIR/urls.txt" ]]; then
            echo "::error::Provide at least one URL."
            exit 1
          fi

          while read -r url; do
            if [[ "$url" != http://* && "$url" != https://* ]]; then
              echo "::error::URLs must start with http:// or https:// — got '$url'"
              exit 1
            fi
          done < "$RUN_DIR/urls.txt"

          echo "Auditing $(wc -l < "$RUN_DIR/urls.txt") URL(s)."

      - name: Run desktop and mobile audits
        shell: bash
        run: |
          python3 scripts/run_audit.py \
            --urls-file "$RUN_DIR/urls.txt" \
            --reports-dir "$RUN_DIR/reports" \
            --out "$RUN_DIR/reports/a11y-audit.md"

      - name: Publish digest to the run log and summary
        shell: bash
        run: |
          cat "$RUN_DIR/reports/a11y-audit.md" >> "$GITHUB_STEP_SUMMARY"
          echo "::group::a11y-audit.md"
          cat "$RUN_DIR/reports/a11y-audit.md"
          echo "::endgroup::"

      - name: Upload audit reports
        uses: actions/upload-artifact@v4
        with:
          name: a11y-audit-${{ github.run_id }}
          path: /tmp/a11y-audit/reports/
          if-no-files-found: error
          retention-days: 14
